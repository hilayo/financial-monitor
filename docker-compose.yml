services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/financialmonitor.db"
      Redis__ConnectionString: "redis:6379"
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:8080"
    volumes:
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy

  api-replica:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/financialmonitor.db"
      Redis__ConnectionString: "redis:6379"
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:8080"
      Cors__Origins__2: "http://localhost:8081"
    volumes:
      - api-replica-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  api-data:
  api-replica-data:
